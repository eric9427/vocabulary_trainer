<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vokabeln">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Vokabeltrainer</title>
<style>
  :root{
    --bg:#f2f2f7; --card:#ffffff; --card2:#ffffff; --text:#1c1c1e; --muted:#8a8a8e;
    --line:#e5e5ea; --blue:#0a84ff; --green:#34c759; --orange:#ff9f0a; --red:#ff3b30;
    --field:#ffffff; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000; --card:#1c1c1e; --card2:#2c2c2e; --text:#ffffff; --muted:#98989f;
      --line:#38383a; --field:#1c1c1e; --shadow:none;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text);
    -webkit-text-size-adjust:100%;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .app{max-width:560px; margin:0 auto; padding:12px 16px 28px; min-height:100%}
  h1{font-size:22px; font-weight:700; margin:6px 0 2px}
  .sub{color:var(--muted); font-size:13px; margin:0 0 14px}
  .row{display:flex; align-items:center; gap:10px}
  .spacer{flex:1}
  button{font-family:inherit; font-size:16px; cursor:pointer; border:none; color:inherit; background:none}
  .iconbtn{width:38px;height:38px;border-radius:19px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:var(--shadow)}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:8px 0 18px}
  .stat{background:var(--card); border-radius:14px; padding:14px 14px; box-shadow:var(--shadow)}
  .stat .n{font-size:26px; font-weight:700; line-height:1}
  .stat .l{color:var(--muted); font-size:12px; margin-top:6px}
  .stat.due .n{color:var(--blue)} .stat.hard .n{color:var(--orange)} .stat.learned .n{color:var(--green)}
  .btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
       padding:15px; border-radius:14px; font-size:17px; font-weight:600; margin-bottom:10px;
       background:var(--card); box-shadow:var(--shadow)}
  .btn.primary{background:var(--blue); color:#fff}
  .btn.warn{background:var(--card); color:var(--orange)}
  .btn small{font-weight:500; opacity:.7; font-size:13px}
  .btn:disabled{opacity:.4}
  .card{background:var(--card); border-radius:16px; padding:20px; box-shadow:var(--shadow); margin-bottom:14px}
  .hidden{display:none !important}

  /* practice */
  .topbar{display:flex; align-items:center; gap:8px; margin-bottom:14px}
  .progress{flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden}
  .progress > i{display:block; height:100%; background:var(--blue); width:0%; transition:width .25s}
  .modechip{font-size:12px; color:var(--muted)}
  .prompt-label{color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.04em}
  .prompt{font-size:27px; font-weight:600; margin:6px 0 2px; line-height:1.25}
  .prompt-extra{color:var(--muted); font-size:14px; margin-top:4px}
  input.answer{width:100%; margin-top:16px; padding:14px; font-size:18px; border-radius:12px;
       border:1px solid var(--line); background:var(--field); color:var(--text)}
  input.answer:focus{outline:none; border-color:var(--blue)}
  .reveal-label{color:var(--muted); font-size:13px; margin-top:2px}
  .answer-en{font-size:23px; font-weight:600; margin:4px 0 2px; line-height:1.3}
  .yours{font-size:14px; color:var(--muted); margin-top:8px}
  .hint{display:inline-block; margin-top:12px; padding:5px 11px; border-radius:20px; font-size:13px; font-weight:600}
  .hint.ok{background:rgba(52,199,89,.15); color:var(--green)}
  .hint.near{background:rgba(255,159,10,.15); color:var(--orange)}
  .hint.miss{background:rgba(255,59,48,.12); color:var(--red)}
  .badge-hard{display:inline-block; margin-left:8px; font-size:11px; font-weight:700; color:var(--orange);
       background:rgba(255,159,10,.15); padding:2px 8px; border-radius:10px; vertical-align:middle}

  .grades{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:6px}
  .grade{padding:14px 6px; border-radius:14px; font-weight:700; font-size:15px; color:#fff; line-height:1.15}
  .grade small{display:block; font-weight:500; font-size:11px; opacity:.9; margin-top:3px}
  .grade.g0{background:var(--red)} .grade.g1{background:var(--orange)} .grade.g2{background:var(--green)}
  .linkbtn{color:var(--blue); font-size:15px; padding:8px 4px}
  .center{text-align:center}

  /* sheet / modal */
  .sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; z-index:50}
  .sheet{background:var(--bg); width:100%; max-width:560px; margin:0 auto; border-radius:18px 18px 0 0;
         padding:10px 16px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow:auto}
  .grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 12px}
  .sheet h2{font-size:19px; margin:4px 0 12px}
  .list{background:var(--card); border-radius:14px; overflow:hidden; margin-bottom:16px; box-shadow:var(--shadow)}
  .item{display:flex; align-items:center; gap:12px; padding:15px 16px; border-bottom:1px solid var(--line); font-size:16px; width:100%; text-align:left; background:none}
  .item:last-child{border-bottom:none}
  .item .ic{font-size:19px; width:24px; text-align:center}
  .item .tx{flex:1}
  .item .tx small{display:block; color:var(--muted); font-size:12px; margin-top:2px; font-weight:400}
  .item.danger{color:var(--red)}
  .toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%);
         background:#000; color:#fff; padding:11px 18px; border-radius:22px; font-size:14px; z-index:80;
         opacity:0; transition:opacity .25s; max-width:90%; text-align:center; box-shadow:0 4px 16px rgba(0,0,0,.3)}
  .toast.show{opacity:.95}
  @media (prefers-color-scheme: dark){ .toast{background:#2c2c2e} }
  .savebar{font-size:12px; color:var(--muted); text-align:center; margin-top:6px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:4px;vertical-align:middle;margin-right:5px}
  .dot.dirty{background:var(--orange)} .dot.clean{background:var(--green)}
  .help p{font-size:14px; line-height:1.5; color:var(--text)}
  .help small{color:var(--muted)}
  .filepick{display:none}
</style>

<div class="app">

  <!-- ============ HOME ============ -->
  <section id="home">
    <div class="row">
      <div>
        <h1>Vokabeltrainer</h1>
        <p class="sub" id="homeSub">Deutsch → Englisch</p>
      </div>
      <div class="spacer"></div>
      <button class="iconbtn" id="openMenu" aria-label="Menü">⚙️</button>
    </div>

    <div class="grid">
      <div class="stat due"><div class="n" id="statDue">0</div><div class="l">Fällig zum Üben</div></div>
      <div class="stat hard"><div class="n" id="statHard">0</div><div class="l">Schwierige Wörter</div></div>
      <div class="stat learned"><div class="n" id="statLearned">0</div><div class="l">Gut gelernt</div></div>
      <div class="stat"><div class="n" id="statTotal">0</div><div class="l">Wörter gesamt</div></div>
    </div>

    <button class="btn primary" id="startDue">Üben <small id="dueHint"></small></button>
    <button class="btn warn" id="startHard">Nur schwierige Wörter <small id="hardHint"></small></button>
    <button class="btn" id="startAll">Alle Wörter durchmischen</button>

    <div class="savebar" id="saveBar"></div>
  </section>

  <!-- ============ PRACTICE ============ -->
  <section id="practice" class="hidden">
    <div class="topbar">
      <button class="iconbtn" id="quit" aria-label="Zurück">✕</button>
      <div class="progress"><i id="progFill"></i></div>
      <span class="modechip" id="modeChip"></span>
    </div>

    <div class="card">
      <div class="prompt-label">Deutsch</div>
      <div class="prompt" id="promptDe">–</div>
      <div class="prompt-extra" id="promptExtra"></div>

      <div id="askArea">
        <input class="answer" id="answerInput" type="text" autocomplete="off" autocapitalize="none"
               autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="Englisch eingeben …">
        <button class="btn primary" id="checkBtn" style="margin-top:14px">Aufdecken</button>
      </div>

      <div id="revealArea" class="hidden">
        <div class="reveal-label">Richtige Antwort</div>
        <div class="answer-en" id="answerEn">–</div>
        <div class="yours" id="yourAnswer"></div>
        <span class="hint" id="hint"></span>
      </div>
    </div>

    <div id="gradeArea" class="hidden">
      <p class="sub center" style="margin:2px 0 10px">Wie gut saß es?</p>
      <div class="grades">
        <button class="grade g0" data-g="0">Gar nicht<small>bald wieder</small></button>
        <button class="grade g1" data-g="1">Fast<small>morgen nochmal</small></button>
        <button class="grade g2" data-g="2">Perfekt<small>erledigt</small></button>
      </div>
      <button class="linkbtn center" id="skipBtn" style="display:block;margin:14px auto 0">Überspringen</button>
    </div>
  </section>

  <!-- ============ SESSION DONE ============ -->
  <section id="done" class="hidden">
    <div class="card center">
      <div style="font-size:44px">🎉</div>
      <h1 style="margin:10px 0 4px">Geschafft!</h1>
      <p class="sub" id="doneText" style="margin-bottom:0"></p>
    </div>
    <button class="btn primary" id="doneHome">Zur Übersicht</button>
  </section>

</div>

<!-- ============ MENU SHEET ============ -->
<div id="menu" class="sheet-bg hidden">
  <div class="sheet">
    <div class="grab"></div>
    <h2>Menü &amp; Sicherung</h2>

    <div class="list">
      <button class="item" id="mExport"><span class="ic">📤</span><span class="tx">In iCloud sichern <small>Backup-Datei zum Ablegen in iCloud Drive</small></span></button>
      <button class="item" id="mImportJson"><span class="ic">📥</span><span class="tx">Backup laden <small>Fortschritt aus Sicherungsdatei wiederherstellen</small></span></button>
    </div>

    <div class="list">
      <button class="item" id="mImportList"><span class="ic">➕</span><span class="tx">Neue Vokabelliste importieren <small>dict.cc-Format (.txt), Fortschritt bleibt erhalten</small></span></button>
    </div>

    <div class="list">
      <button class="item" id="mInfo"><span class="ic">💾</span><span class="tx">Speicher &amp; Info <small id="storageLine">–</small></span></button>
      <button class="item danger" id="mReset"><span class="ic">🗑️</span><span class="tx">Alle Fortschritte zurücksetzen</span></button>
    </div>

    <button class="linkbtn center" id="menuClose" style="display:block;margin:0 auto">Schließen</button>
  </div>
</div>

<!-- ============ HELP SHEET ============ -->
<div id="helpSheet" class="sheet-bg hidden">
  <div class="sheet help">
    <div class="grab"></div>
    <h2>So funktioniert's</h2>
    <div id="helpBody"></div>
    <button class="linkbtn center" id="helpClose" style="display:block;margin:6px auto 0">Schließen</button>
  </div>
</div>

<input class="filepick" id="fileJson" type="file" accept=".json,application/json">
<input class="filepick" id="fileList" type="file" accept=".txt,text/plain">
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var LS_KEY = "vokabeltrainer.v1";
  var DAY = 86400000;
  // Leitner intervals in days, index = box (0..5)
  var INTERVAL = [0, 1, 2, 4, 9, 21];
  var HARD_CLEARS_AT = 3;   // box at which a word stops counting as "schwierig"
  var LEARNED_AT = 4;       // box at which a word counts as "gut gelernt"

  var store = null;   // {version, updated, savedAt, entries:[...]}
  var session = null; // {mode, queue:[entry], total, mastered}
  // "dirty" = data changed since the last exported backup. Derived from
  // timestamps so it stays correct across reloads (survives closing the app).
  function isDirty(){ return store ? (store.updated||0) > (store.savedAt||0) : false; }

  // ---------- helpers ----------
  var $ = function(id){ return document.getElementById(id); };
  function show(id){ $(id).classList.remove("hidden"); }
  function hide(id){ $(id).classList.add("hidden"); }
  function toast(msg){
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  // Normalise an English string for the (assistive) match hint.
  function norm(s){
    return s.toLowerCase()
      .replace(/\[[^\]]*\]/g," ")   // [Br.], [coll.] ...
      .replace(/\{[^}]*\}/g," ")    // {m}, {pl} ...
      .replace(/\([^)]*\)/g," ")    // (...)
      .replace(/\bto\b/g," ")
      .replace(/\b(sth|sb|one's|oneself|so|etw|jdn|jdm)\b\.?/g," ")
      .replace(/[.,;:!?/'"’\-]/g," ")
      .replace(/\s+/g," ").trim();
  }
  function levenshtein(a,b){
    if(a===b) return 0;
    var m=a.length,n=b.length; if(!m) return n; if(!n) return m;
    var prev=new Array(n+1),cur=new Array(n+1),i,j;
    for(j=0;j<=n;j++) prev[j]=j;
    for(i=1;i<=m;i++){ cur[0]=i;
      for(j=1;j<=n;j++){
        var cost=a.charCodeAt(i-1)===b.charCodeAt(j-1)?0:1;
        cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+cost);
      }
      var tmp=prev; prev=cur; cur=tmp;
    }
    return prev[n];
  }
  function judge(userRaw, answerEn){
    var u = norm(userRaw||"");
    if(!u) return "miss";
    // the stored English may hold several variants separated by "/"
    var parts = answerEn.split("/").map(norm).filter(Boolean);
    parts.push(norm(answerEn));
    for(var i=0;i<parts.length;i++){
      var a=parts[i]; if(!a) continue;
      if(a===u) return "ok";
      if(a.indexOf(u)>=0 || u.indexOf(a)>=0) return "ok";
      var d=levenshtein(a,u), lim=Math.max(1, Math.round(Math.max(a.length,u.length)*0.2));
      if(d<=lim) return "near";
    }
    return "miss";
  }

  // ---------- data ----------
  function parseTSV(text){
    var out=[], lines=text.replace(/\r/g,"").split("\n");
    for(var i=0;i<lines.length;i++){
      var ln=lines[i]; if(!ln) continue;
      var t=ln.indexOf("\t"); if(t<0) continue;
      var en=ln.slice(0,t).trim(), de=ln.slice(t+1).trim();
      if(en && de) out.push([en,de]);
    }
    return out;
  }
  function newEntry(en,de){
    return { en:en, de:de, box:0, due:0, streak:0, seen:0, hard:false };
  }
  function seedStore(){
    var seed = parseTSV($("seed").textContent);
    var seen={}, entries=[];
    for(var i=0;i<seed.length;i++){
      var key=seed[i][0]+"\t"+seed[i][1];
      if(seen[key]) continue; seen[key]=1;
      entries.push(newEntry(seed[i][0], seed[i][1]));
    }
    return { version:1, updated:Date.now(), savedAt:0, entries:entries };
  }
  function load(){
    try{
      var raw = localStorage.getItem(LS_KEY);
      if(raw){ store = JSON.parse(raw); }
    }catch(e){ store=null; }
    if(!store || !store.entries || !store.entries.length){
      store = seedStore();       // savedAt=0 -> counts as unsynced until first backup
      persist();
    }
  }
  function persist(){
    store.updated = Date.now();
    try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }
    catch(e){ toast("Speicher voll – bitte Backup exportieren"); }
    renderSaveBar();
  }

  // ---------- stats & home ----------
  function counts(){
    var now=Date.now(), due=0, hard=0, learned=0;
    for(var i=0;i<store.entries.length;i++){
      var e=store.entries[i];
      if((e.due||0) <= now) due++;
      if(e.hard) hard++;
      if(e.box >= LEARNED_AT) learned++;
    }
    return {due:due, hard:hard, learned:learned, total:store.entries.length};
  }
  function renderHome(){
    var c=counts();
    $("statDue").textContent=c.due;
    $("statHard").textContent=c.hard;
    $("statLearned").textContent=c.learned;
    $("statTotal").textContent=c.total;
    $("dueHint").textContent = c.due? "· "+c.due+" fällig" : "· nichts fällig";
    $("hardHint").textContent = c.hard? "· "+c.hard : "";
    $("startDue").disabled = c.due===0;
    $("startHard").disabled = c.hard===0;
    renderSaveBar();
  }
  function renderSaveBar(){
    var bar=$("saveBar");
    if(isDirty()){
      bar.innerHTML='<span class="dot dirty"></span>Ungesicherte Änderungen – über ⚙️ „In iCloud sichern"';
    }else{
      var d = store.savedAt? new Date(store.savedAt) : null;
      bar.innerHTML='<span class="dot clean"></span>Gesichert'+(d? " · "+d.toLocaleDateString():"" );
    }
  }

  // ---------- practice ----------
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  function startSession(mode){
    var now=Date.now(), pool=[];
    for(var i=0;i<store.entries.length;i++){
      var e=store.entries[i];
      if(mode==="due" && (e.due||0)>now) continue;
      if(mode==="hard" && !e.hard) continue;
      pool.push(e);
    }
    if(mode==="due"){ pool.sort(function(a,b){ return (a.due||0)-(b.due||0); }); }
    else { shuffle(pool); }
    if(!pool.length){ toast("Nichts zu üben"); return; }
    session = { mode:mode, queue:pool.slice(), total:pool.length, mastered:0 };
    hide("home"); hide("done"); show("practice");
    $("modeChip").textContent = mode==="due"?"Fällig":mode==="hard"?"Schwierige":"Alle";
    nextCard();
  }

  function nextCard(){
    if(!session.queue.length){ finishSession(); return; }
    var e = session.queue[0];
    session.current = e;
    // reset card UI
    show("askArea"); hide("revealArea"); hide("gradeArea");
    $("promptDe").innerHTML = escapeHtml(e.de) + (e.hard? '<span class="badge-hard">schwierig</span>':'');
    $("promptExtra").textContent = "";
    $("answerInput").value=""; $("answerInput").disabled=false;
    var done = session.total - session.queue.length;
    $("progFill").style.width = Math.round(100*done/session.total)+"%";
    // focus (works after a user gesture; harmless otherwise)
    setTimeout(function(){ try{ $("answerInput").focus(); }catch(e){} }, 30);
  }

  function reveal(){
    var e=session.current;
    var verdict = judge($("answerInput").value, e.en);
    show("revealArea"); hide("askArea"); show("gradeArea");
    $("answerEn").textContent = e.en;
    var yv = $("answerInput").value.trim();
    $("yourAnswer").textContent = yv? "Deine Eingabe: "+yv : "(keine Eingabe)";
    var h=$("hint");
    h.className="hint "+(verdict==="ok"?"ok":verdict==="near"?"near":"miss");
    h.textContent = verdict==="ok"?"✓ stimmt überein":verdict==="near"?"≈ fast richtig":"✗ weicht ab";
    // pre-highlight the suggested grade button subtly
  }

  function grade(g){
    var e=session.current, now=Date.now();
    e.seen = (e.seen||0)+1;
    if(g===2){ // Perfekt
      e.box = Math.min(5, (e.box||0)+1);
      e.streak = (e.streak||0)+1;
      e.due = now + DAY*INTERVAL[e.box];
      if(e.box >= HARD_CLEARS_AT) e.hard = false;
      session.queue.shift();
      session.mastered++;
    } else if(g===1){ // Fast
      e.streak = 0;
      e.due = now + DAY*1;
      if(e.box < HARD_CLEARS_AT) e.hard = true;
      var it=session.queue.shift(); session.queue.push(it); // nochmal in dieser Runde
    } else { // Gar nicht
      e.box = 0; e.streak = 0; e.due = now; e.hard = true;
      var it2=session.queue.shift(); session.queue.push(it2);
    }
    persist();
    nextCard();
  }

  function skip(){
    var it=session.queue.shift(); session.queue.push(it);
    nextCard();
  }

  function finishSession(){
    hide("practice"); show("done");
    $("doneText").textContent = session.mastered+' Wörter als „Perfekt" abgehakt. Weiter so!';
    session=null; renderHome();
  }

  function quitSession(){
    session=null; hide("practice"); show("home"); renderHome();
  }

  function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  // ---------- import / export ----------
  function exportBackup(){
    store.savedAt = Date.now();
    try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){}
    var blob = new Blob([JSON.stringify(store)], {type:"application/json"});
    var d=new Date(), pad=function(n){return (n<10?"0":"")+n;};
    var name = "vokabeln-backup-"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+".json";
    var url = URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    renderSaveBar();   // savedAt now >= updated -> shows "Gesichert"
    toast("Backup erstellt – in iCloud Drive ablegen");
  }

  function importJson(file){
    var r=new FileReader();
    r.onload=function(){
      try{
        var obj=JSON.parse(r.result);
        if(!obj.entries || !obj.entries.length) throw new Error("leer");
        store=obj; if(!store.version) store.version=1;
        store.savedAt=Date.now();   // just restored from a file -> in sync
        localStorage.setItem(LS_KEY, JSON.stringify(store));
        renderHome(); closeMenu();
        toast("Backup geladen: "+store.entries.length+" Wörter");
      }catch(e){ toast("Datei nicht lesbar"); }
    };
    r.readAsText(file);
  }

  function importList(file){
    var r=new FileReader();
    r.onload=function(){
      var pairs=parseTSV(r.result);
      if(!pairs.length){ toast("Keine gültigen Zeilen gefunden"); return; }
      var index={}, i;
      for(i=0;i<store.entries.length;i++){
        var e=store.entries[i];
        index[e.en+"\t"+e.de]=true;
      }
      var added=0, seen={};
      for(i=0;i<pairs.length;i++){
        var key=pairs[i][0]+"\t"+pairs[i][1];
        if(seen[key]) continue; seen[key]=1;
        if(!index[key]){ store.entries.push(newEntry(pairs[i][0],pairs[i][1])); index[key]=true; added++; }
      }
      persist(); renderHome(); closeMenu();
      toast(added? added+" neue Wörter hinzugefügt":"Keine neuen Wörter – alles schon vorhanden");
    };
    r.readAsText(file);
  }

  function resetAll(){
    if(!confirm("Wirklich ALLE Wörter und Fortschritte löschen und die eingebaute Startliste wiederherstellen?")) return;
    store=seedStore(); localStorage.setItem(LS_KEY, JSON.stringify(store));
    renderHome(); closeMenu(); toast("Zurückgesetzt");
  }

  // ---------- menu / info ----------
  function openMenu(){
    var bytes = new Blob([JSON.stringify(store)]).size;
    var kb = (bytes/1024).toFixed(0);
    $("storageLine").textContent = store.entries.length+" Wörter · ca. "+kb+" KB belegt";
    show("menu");
  }
  function closeMenu(){ hide("menu"); }

  var HELP = ''+
    '<p><b>Abfrage:</b> Dir wird das deutsche Wort gezeigt. Tippe deine englische Übersetzung ein und drücke <b>Aufdecken</b>. '+
    'Danach vergleichst du selbst und wählst:</p>'+
    '<p>🟥 <b>Gar nicht</b> – kommt sofort wieder dran und wird als <i>schwierig</i> markiert.<br>'+
    '🟧 <b>Fast</b> – morgen nochmal, bleibt vorerst schwierig.<br>'+
    '🟩 <b>Perfekt</b> – rückt eine Stufe weiter, größerer Abstand bis zur nächsten Abfrage.</p>'+
    '<p><b>Wann verschwindet ein Wort aus „schwierig"?</b> Nach '+HARD_CLEARS_AT+'× hintereinander „Perfekt" (Stufe '+HARD_CLEARS_AT+'). '+
    'Ab Stufe '+LEARNED_AT+' zählt es als „gut gelernt". Die Wiederhol-Abstände wachsen: 1, 2, 4, 9, 21 Tage.</p>'+
    '<p><b>iCloud-Sicherung:</b> Der Fortschritt liegt sofort lokal im Browser. Für iCloud tippe ⚙️ → '+
    '<b>In iCloud sichern</b>, wähle im Teilen-Dialog <i>„In Dateien sichern"</i> und lege die Datei in deinem iCloud-Drive-Ordner ab. '+
    'Zum Wiederherstellen: <b>Backup laden</b>.</p>'+
    '<p><b>Neue Liste:</b> Über <b>Neue Vokabelliste importieren</b> lädst du eine erweiterte dict.cc-Datei (.txt). '+
    'Schon vorhandene Wörter behalten ihren Fortschritt, nur neue kommen dazu.</p>'+
    '<p><small>Speicherbedarf: ca. 0,1–0,2 KB pro Wort inkl. Fortschritt. Auch 6.000 Wörter bleiben unter ~1,5 MB – '+
    'weit unter dem Limit. Der Verbrauch wächst nur mit der Wortzahl, nicht mit der Übungszeit.</small></p>';

  // ---------- events ----------
  $("startDue").onclick=function(){ startSession("due"); };
  $("startHard").onclick=function(){ startSession("hard"); };
  $("startAll").onclick=function(){ startSession("all"); };
  $("checkBtn").onclick=reveal;
  $("answerInput").addEventListener("keydown",function(ev){ if(ev.key==="Enter"){ ev.preventDefault(); reveal(); } });
  $("skipBtn").onclick=skip;
  $("quit").onclick=quitSession;
  $("doneHome").onclick=function(){ hide("done"); show("home"); renderHome(); };
  Array.prototype.forEach.call(document.querySelectorAll(".grade"),function(b){
    b.onclick=function(){ grade(parseInt(b.getAttribute("data-g"),10)); };
  });

  $("openMenu").onclick=openMenu;
  $("menuClose").onclick=closeMenu;
  $("menu").addEventListener("click",function(e){ if(e.target.id==="menu") closeMenu(); });
  $("mExport").onclick=exportBackup;
  $("mImportJson").onclick=function(){ $("fileJson").click(); };
  $("mImportList").onclick=function(){ $("fileList").click(); };
  $("mReset").onclick=resetAll;
  $("mInfo").onclick=function(){ $("helpBody").innerHTML=HELP; hide("menu"); show("helpSheet"); };
  $("helpClose").onclick=function(){ hide("helpSheet"); };
  $("helpSheet").addEventListener("click",function(e){ if(e.target.id==="helpSheet") hide("helpSheet"); });
  $("fileJson").onchange=function(){ if(this.files[0]) importJson(this.files[0]); this.value=""; };
  $("fileList").onchange=function(){ if(this.files[0]) importList(this.files[0]); this.value=""; };

  // ---------- go ----------
  load(); renderHome();
})();
</script>
